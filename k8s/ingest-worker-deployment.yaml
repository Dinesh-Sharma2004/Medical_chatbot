apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-worker
  namespace: medical-chatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingest-worker
  template:
    metadata:
      labels:
        app: ingest-worker
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: ingest-worker
          image: REPLACE_ME_BACKEND_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.ingest_worker"]
          envFrom:
            - configMapRef:
                name: medical-chatbot-config
            - secretRef:
                name: medical-chatbot-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: backend-data
              mountPath: /app/backend/data
            - name: vectorstore
              mountPath: /app/vectorstore
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: medical-chatbot-data
        - name: vectorstore
          persistentVolumeClaim:
            claimName: medical-chatbot-vectorstore
