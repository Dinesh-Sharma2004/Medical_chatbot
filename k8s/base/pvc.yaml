apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medical-chatbot-data
  namespace: medical-chatbot
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medical-chatbot-vectorstore
  namespace: medical-chatbot
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
