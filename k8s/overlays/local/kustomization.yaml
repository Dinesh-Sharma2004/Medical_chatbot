apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: REPLACE_ME_BACKEND_IMAGE
    newName: medical-chatbot-backend
    newTag: local
  - name: REPLACE_ME_FRONTEND_IMAGE
    newName: medical-chatbot-frontend
    newTag: local
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
