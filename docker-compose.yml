name: medical-chatbot

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  env_file:
    - ./backend/.env
  environment:
    PORT: "8000"
    DB_FAISS_BASE: /app/vectorstore
    REDIS_URL: redis://redis:6379/0
    HF_HOME: /app/.cache/huggingface
    AUTH_DATABASE_URL: "${AUTH_DATABASE_URL:-postgresql://medibot:medibot@postgres:5432/medibot}"
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    ALL_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    all_proxy: ""
  volumes:
    - ./backend/data:/app/backend/data
    - ./vectorstore:/app/vectorstore
    - ./models-cache:/app/.cache/huggingface
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s
  networks:
    - medibot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-medibot}"
      POSTGRES_USER: "${POSTGRES_USER:-medibot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-medibot}"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medibot

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - medibot

  backend-1:
    <<: *backend-common
    hostname: backend-1
    networks:
      medibot:
        aliases:
          - backend-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # backend-2:
  #   <<: *backend-common
  #   hostname: backend-2
  #   networks:
  #     medibot:
  #       aliases:
  #         - backend-api
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  # backend-3:
  #   <<: *backend-common
  #   hostname: backend-3
  #   networks:
  #     medibot:
  #       aliases:
  #         - backend-api
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  ingest-worker:
    <<: *backend-common
    command: ["python", "-m", "backend.ingest_worker"]
    # deploy:
    #   replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nfrom redis import Redis\nimport os\nRedis.from_url(os.environ['REDIS_URL']).ping()\nPY"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  auth-service:
    <<: *backend-common
    command: ["sh", "-c", "uvicorn backend.auth_service:app --host 0.0.0.0 --port 8001 --proxy-headers"]
    hostname: auth-service
    environment:
      PORT: "8001"
      AUTH_DATABASE_URL: "${AUTH_DATABASE_URL:-postgresql://medibot:medibot@postgres:5432/medibot}"
      DB_FAISS_BASE: /app/vectorstore
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /app/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medibot

  backend:
    image: nginx:1.27-alpine
    depends_on:
      backend-1:
        condition: service_healthy
      # backend-2:
      #   condition: service_healthy
      # backend-3:
      #   condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./ops/nginx/backend-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - medibot

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - medibot

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      backend-1:
        condition: service_healthy
      # backend-2:
      #   condition: service_healthy
      # backend-3:
      #   condition: service_healthy
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - medibot

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - medibot

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  medibot:
